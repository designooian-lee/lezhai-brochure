name: Deploy Lezhai Brochure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lezhai-brochure-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lezhai_brochure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl,fileinfo,gd,mbstring,openssl,pdo_pgsql,pgsql,zip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:website
      - run: pnpm run build:website
      - run: pnpm run test:website-assets
      - run: npx playwright install --with-deps chromium

      - name: Configure tests
        run: |
          HASH=$(php -r "echo password_hash('ci-password', PASSWORD_DEFAULT);")
          cat > .env <<EOF
          APP_ENV=test
          APP_BASE_PATH=
          APP_SECRET=ci-secret
          DB_DSN=pgsql:host=127.0.0.1;port=5432;dbname=lezhai_brochure
          DB_USER=postgres
          DB_PASSWORD=postgres
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD_HASH=$HASH
          NODE_BINARY=node
          BROWSER_EXECUTABLE=
          EOF

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
      - run: php scripts/migrate.php
      - run: php scripts/seed.php
      - run: php tests/run.php
      - run: php tests/indexnow.php
      - run: node tests/http-smoke.js
        env:
          TEST_ADMIN_PASSWORD: ci-password

      - name: Build production image
        env:
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_STATICFORMS_API_KEY: ${{ secrets.PUBLIC_STATICFORMS_API_KEY }}
          PUBLIC_FORM_SUBJECT: ${{ vars.PUBLIC_FORM_SUBJECT }}
          PUBLIC_PHONE: ${{ vars.PUBLIC_PHONE }}
          PUBLIC_ADDRESS: ${{ vars.PUBLIC_ADDRESS }}
          PUBLIC_BUSINESS_HOURS: ${{ vars.PUBLIC_BUSINESS_HOURS }}
        run: |
          docker build \
            --build-arg PUBLIC_SITE_ENV=production \
            --build-arg PUBLIC_FORM_ENDPOINT="$PUBLIC_FORM_ENDPOINT" \
            --build-arg PUBLIC_STATICFORMS_API_KEY="$PUBLIC_STATICFORMS_API_KEY" \
            --build-arg PUBLIC_FORM_SUBJECT="$PUBLIC_FORM_SUBJECT" \
            --build-arg PUBLIC_PHONE="$PUBLIC_PHONE" \
            --build-arg PUBLIC_ADDRESS="$PUBLIC_ADDRESS" \
            --build-arg PUBLIC_BUSINESS_HOURS="$PUBLIC_BUSINESS_HOURS" \
            -t "lezhai-brochure:${GITHUB_SHA}" .
          docker run --rm --entrypoint php "lezhai-brochure:${GITHUB_SHA}" -r 'if(ini_get("upload_max_filesize")!=="500M"||ini_get("post_max_size")!=="510M"){fwrite(STDERR,"Unexpected upload limits\n");exit(1);}'
          docker run --rm --entrypoint php-fpm "lezhai-brochure:${GITHUB_SHA}" -tt
          docker run --rm --memory=96m --entrypoint php "lezhai-brochure:${GITHUB_SHA}" scripts/validate-sources.php
          for book in wxfu/egep wxfu/nela gfrl/keqh pwww/tzyw wxfu/gjkr wxfu/jzkx glos/pitj; do
            docker run --rm --memory=280m --entrypoint node "lezhai-brochure:${GITHUB_SHA}" scripts/yunzhan-export.js "https://book.yunzhan365.com/${book}/mobile/index.html" /tmp/yunzhan-smoke 1 /usr/bin/chromium-browser
          done
          printf 'LEZHAI_IMAGE=lezhai-brochure:%s\n' "$GITHUB_SHA" > release.env
          {
            printf 'PUBLIC_FORM_ENDPOINT_B64=%s\n' "$(printf '%s' "$PUBLIC_FORM_ENDPOINT" | base64 -w0)"
            printf 'PUBLIC_STATICFORMS_API_KEY_B64=%s\n' "$(printf '%s' "$PUBLIC_STATICFORMS_API_KEY" | base64 -w0)"
            printf 'PUBLIC_FORM_SUBJECT_B64=%s\n' "$(printf '%s' "$PUBLIC_FORM_SUBJECT" | base64 -w0)"
            printf 'PUBLIC_PHONE_B64=%s\n' "$(printf '%s' "$PUBLIC_PHONE" | base64 -w0)"
            printf 'PUBLIC_ADDRESS_B64=%s\n' "$(printf '%s' "$PUBLIC_ADDRESS" | base64 -w0)"
            printf 'PUBLIC_BUSINESS_HOURS_B64=%s\n' "$(printf '%s' "$PUBLIC_BUSINESS_HOURS" | base64 -w0)"
          } > build.env
          tar -czf lezhai-brochure-release.tgz docker-compose.production.yml release.env build.env

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.VPS_SSH_KEY }}' > ~/.ssh/deploy_key
          printf '%s\n' '${{ secrets.VPS_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload release
        run: |
          printf '%s\n' "$GITHUB_SHA" > .lezhai-source-sha
          ssh -i ~/.ssh/deploy_key -p '${{ secrets.VPS_PORT }}' '${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}' 'mkdir -p /opt/apps/lezhai-brochure/source'
          rsync -azc --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='build.env' \
            --exclude='release.env' \
            --exclude='lezhai-brochure-release.tgz' \
            --exclude='node_modules/' \
            --exclude='storage/runtime/' \
            --exclude='storage/logs/' \
            --exclude='storage/downloads/' \
            --exclude='storage/local-pages/' \
            --exclude='storage/website-dist/' \
            --exclude='public/uploads/' \
            --exclude='website-source/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }}" \
            ./ '${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/apps/lezhai-brochure/source/'
          scp -i ~/.ssh/deploy_key -P '${{ secrets.VPS_PORT }}' lezhai-brochure-release.tgz '${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/lezhai-brochure-release.tgz'
          scp -i ~/.ssh/deploy_key -P '${{ secrets.VPS_PORT }}' scripts/ci/remote-publish.sh '${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/remote-publish.sh'

      - name: Publish on VPS
        run: ssh -i ~/.ssh/deploy_key -p '${{ secrets.VPS_PORT }}' '${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}' 'bash /tmp/remote-publish.sh'

      - name: Smoke test
        run: |
          smoke() {
            curl --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-redirs 5 -fLsS "$1" >/dev/null
          }
          smoke https://lezhai.life/
          smoke https://lezhai.life/health
          smoke https://lezhai.life/articles
          smoke https://lezhai.life/brochure
          smoke https://lezhai.life/admin/login
          test "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' https://www.lezhai.life/)" = "301 https://lezhai.life/"
